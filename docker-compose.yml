services:
  db:
    image: postgres:16
    container_name: netwach-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-netwach-db}
      POSTGRES_USER: ${DB_USER:-netwach}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-netwach}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-netwach} -d ${DB_NAME:-netwach-db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: netwatch-backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

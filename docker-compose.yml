services:
  db:
    image: postgres:16
    container_name: netwach-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-netwach-db}
      POSTGRES_USER: ${DB_USER:-netwach}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-netwach}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback-only: the host-networked app containers reach this via
      # DB_HOST=localhost anyway, so nothing on the LAN needs this port.
      - "127.0.0.1:5432:5432"

  web:
    build: .
    container_name: netwatch-backend
    restart: unless-stopped
    # Host networking so the network app sees the host's real interfaces/ARP
    # table/Wi-Fi radio instead of the isolated container bridge — required
    # for LAN scanning and OS fingerprinting to see the actual LAN, not the
    # Docker bridge subnet. This also means `ports:` below is inert (Docker
    # ignores published ports under host networking) and service-name DNS
    # (`db`) doesn't apply to this container — see DB_HOST override.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Loopback-only: only this host's own Next.js process needs to reach the
    # API. The network app still sends/receives raw LAN traffic fine — that's
    # independent of which address the HTTP server itself listens on.
    command: python manage.py runserver 127.0.0.1:8000
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=localhost
    depends_on:
      - db

  dns-capture:
    build: .
    container_name: netwatch-dns-capture
    restart: unless-stopped
    # Same host networking + raw-socket capabilities as `web`, but running
    # its own long-lived process instead — a continuous packet capture has
    # to be a single dedicated process, not code inside a request-serving
    # worker (multiple workers would each capture and double-write).
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: python manage.py capture_dns
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=localhost
    depends_on:
      - db

  arp-mitm:
    build: .
    container_name: netwatch-arp-mitm
    # Not unless-stopped: when ARP_MITM_ENABLED isn't set, the command exits
    # 0 immediately by design (see network/arp_mitm.py) — unless-stopped
    # would restart-loop forever in that (the default) state. on-failure
    # only restarts on a real crash (non-zero exit), which is what we still
    # want once this is actually enabled and running the poisoning loop.
    restart: on-failure
    # Same host networking + raw-socket capabilities as `dns-capture`. Only
    # actually poisons anything if ARP_MITM_ENABLED=true in .env — off by
    # default because this can disrupt every device's connectivity on the
    # LAN if misconfigured.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: python manage.py arp_mitm
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=localhost
    depends_on:
      - db

volumes:
  postgres_data:
